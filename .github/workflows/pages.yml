name: Publicar GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependências
        run: npm install --no-audit --no-fund
      - name: Compilar para GitHub Pages
        run: npm run build
        env:
          GITHUB_PAGES: 'true'
      - name: Selecionar build de GitHub Actions como origem
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X PUT "repos/$GITHUB_REPOSITORY/pages" -f build_type=workflow
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Confirmar que o HTML compilado está online
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          for attempt in $(seq 1 12); do
            if curl -fsSL --max-time 20 "$SITE_URL" -o /tmp/pages-index.html &&
               grep -Eq 'assets/index-[A-Za-z0-9_-]+\.js' /tmp/pages-index.html &&
               grep -q 'PostFlow' /tmp/pages-index.html; then
              echo "HTML compilado do Vite está acessível em $SITE_URL"
              exit 0
            fi
            echo "Aguardando a publicação ficar acessível ($attempt/12)."
            sleep 5
          done
          echo "::error::O GitHub Pages ainda não está servindo o build Vite."
          exit 1
      - name: Instalar navegador para smoke test
        run: npx playwright install --with-deps chromium
      - name: Validar JavaScript e layout do site publicado
        run: npx playwright test tests/pages-live.spec.js --project=chromium --reporter=list
        env:
          QA_BASE_URL: ${{ steps.deployment.outputs.page_url }}
      - name: Salvar captura do site publicado
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pages-live-screenshot
          path: |
            test-results/
            playwright-report/
          retention-days: 14
